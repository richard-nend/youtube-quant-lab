[project]
name = "quant-lab"
version = "0.1.0"
description = "Reproducible experiments behind every number quoted in the YouTube trading series"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-auth>=2.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "smartmoneyconcepts>=0.0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
